name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build.gradle targets Java 25, so the toolchain must match.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

      # Override the version so the jar and fabric.mod.json match the released tag.
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace -Pversion=${{ steps.version.outputs.value }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Skip the development jars, only the remapped jar and its sources belong in a release.
          assets=$(ls build/libs/*.jar | grep -v -- '-dev\.jar$' || true)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $assets --clobber
          else
            gh release create "$TAG" $assets \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
